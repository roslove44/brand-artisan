name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # cree la GitHub Release
  id-token: write # OIDC : authentifie la publication et signe la provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # merge-base et --generate-notes remontent l'historique

      # Node 24 et pas 22 : le trusted publishing exige npm >= 11.5.1, Node 22
      # embarque 10.9.8. Surtout, pas de `registry-url` : l'option ecrit une ligne
      # `_authToken=` vide dans .npmrc, npm croit l'authentification configuree et
      # n'engage jamais l'echange OIDC (actions/setup-node#1551).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@latest

      - run: npm ci

      # npm ne sait contraindre que le nom du fichier de workflow, pas la branche.
      - name: Le tag pointe un commit de main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ne pointe pas un commit de main"
            exit 1
          fi

      - name: Le tag porte la version des deux paquets
        run: |
          tag="${GITHUB_REF_NAME#v}"
          engine=$(node -p "require('./package.json').version")
          create=$(node -p "require('./create/package.json').version")
          echo "tag=$tag  moteur=$engine  generateur=$create"
          if [ "$tag" != "$engine" ]; then
            echo "::error::le tag $GITHUB_REF_NAME ne porte pas la version du moteur ($engine)"
            exit 1
          fi
          if [ "$engine" != "$create" ]; then
            echo "::error::create/package.json est en $create, le moteur en $engine"
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npm run test:consumer

      - run: npm run test:generator

      # Deduit et non choisi : npm pose `latest` sur toute version publiee sans
      # `--tag`, une preversion deviendrait donc la version par defaut. `%%+*`
      # retire les metadonnees de build, ou un `-` ne signifie pas preversion.
      - name: Choisir le dist-tag depuis la version
        id: disttag
        run: |
          version=$(node -p "require('./package.json').version")
          case "${version%%+*}" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "$version -> dist-tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Le moteur d'abord : le generateur ecrit une dependance `^<version>` vers
      # lui. La provenance est signee d'office, sans `--provenance` ni token.
      - name: Publier le moteur
        run: npm publish --tag ${{ steps.disttag.outputs.tag }}

      - name: Publier le generateur
        working-directory: create
        run: npm publish --tag ${{ steps.disttag.outputs.tag }}

      - name: Creer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.disttag.outputs.tag }}" = "next" ]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
