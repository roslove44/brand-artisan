name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Rend reellement toute l'arborescence de templates/ : garde-fou contre un
      # visuel casse (Satori echoue a l'execution, pas au typecheck).
      - run: npm run build

  # Socle Python de la toolchain de marque. Ne teste que src/brandkit/, jamais
  # les scripts d'une marque : la CI ne doit pas dependre du contenu present.
  brandkit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # skia-python se lie a libGL au chargement, absent des runners headless.
      - run: sudo apt-get update && sudo apt-get install -y libgl1

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync

      - run: uv run python -m unittest discover -s test -p "test_*.py" -v
