name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Rend reellement toute l'arborescence de templates/ : garde-fou contre un
      # visuel casse (Satori echoue a l'execution, pas au typecheck).
      - run: npm run build

      # Empaquette, installe dans un projet vierge et y rend un visuel : le seul
      # controle qui exerce le moteur depuis node_modules, ou vivent les erreurs
      # de packaging que rien d'autre ne voit.
      - run: npm run test:consumer
