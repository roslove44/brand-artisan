name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Satori echoue a l'execution, pas au typecheck : rendre pour de vrai est le
      # seul garde-fou contre un visuel casse.
      - run: npm run build

      - run: npm run test:consumer

      - run: npm run test:generator
